<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickBite Food Delivery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#222;font:15px Arial,sans-serif}header{position:sticky;top:0;background:#fff;padding:16px 5%;display:flex;gap:20px;align-items:center;box-shadow:0 2px 10px #0001;z-index:2}.logo{font-size:24px;font-weight:bold;color:#f16b38}.search{flex:1;padding:12px;border:0;border-radius:10px;background:#f2f2f2;min-width:80px}.btn{border:0;background:#f16b38;color:white;padding:12px 17px;border-radius:10px;cursor:pointer;font-weight:bold}main{max-width:1100px;margin:28px auto;padding:0 20px}.hero{background:#ffeadf;padding:30px;border-radius:20px;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:clamp(27px,4vw,44px);max-width:550px;margin:0 0 10px}.hero p{color:#66534a}.hero span{font-size:75px}h2{margin:28px 0 15px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{background:white;border:1px solid #ddd;padding:9px 15px;border-radius:25px;cursor:pointer}.chip.active{background:#222;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #eee;border-radius:15px;overflow:hidden}.emoji{background:#fff3ec;text-align:center;padding:22px;font-size:55px}.info{padding:14px}.info h3{margin:0 0 8px}.muted{color:#777;font-size:13px}.foodgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.food{display:flex;align-items:center;gap:12px;padding:13px;background:white;border:1px solid #eee;border-radius:13px}.food .emoji{font-size:30px;padding:10px;border-radius:10px}.foodinfo{flex:1}.foodinfo h3{font-size:15px;margin:0 0 6px}.add{background:white;color:#f16b38;border:1px solid #f16b38;padding:8px 12px;border-radius:8px;cursor:pointer}#cart{position:fixed;right:-410px;top:0;width:min(390px,100%);height:100vh;background:white;z-index:5;padding:22px;box-shadow:-5px 0 25px #0002;transition:.25s;display:flex;flex-direction:column}#cart.open{right:0}.cartrow{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}.cartrow button{padding:3px 8px}.cartbottom{margin-top:auto;border-top:1px solid #ddd;padding-top:15px}.close{float:right;border:0;padding:8px;border-radius:50%;cursor:pointer}.empty{text-align:center;color:#777;padding:35px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:12px 18px;border-radius:9px;opacity:0;transition:.2s}#toast.show{opacity:1}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}header{gap:9px;padding:12px}.logo{font-size:19px}}@media(max-width:480px){.grid,.foodgrid{grid-template-columns:1fr}.hero span{font-size:45px}.hero{padding:20px}}
</style></head>
<body>
<header><div class="logo">QuickBite</div><input class="search" id="search" placeholder="Search food or restaurant..."><button class="btn" onclick="openCart()">🛒 Cart <span id="count">0</span></button></header>
<main>
<section class="hero"><div><h1>Good food. Great mood. Delivered.</h1><p>Discover tasty meals from restaurants near you.</p><button class="btn" onclick="document.getElementById('restaurants').scrollIntoView({behavior:'smooth'})">Explore now</button></div><span>🍔🍟</span></section>
<h2 id="restaurants">Popular restaurants</h2><div class="filters" id="filters"><button class="chip active" data-cat="All">All</button><button class="chip" data-cat="Biryani">Biryani</button><button class="chip" data-cat="Pizza">Pizza</button><button class="chip" data-cat="South Indian">South Indian</button><button class="chip" data-cat="Burgers">Burgers</button></div>
<div class="grid" id="restaurantList"></div>
<h2>Popular dishes</h2><div class="foodgrid" id="foodList"></div>
</main>
<aside id="cart"><div><button class="close" onclick="closeCart()">✕</button><h2>Your cart</h2></div><div id="cartItems"></div><div class="cartbottom"><p>Subtotal: <b id="subtotal">₹0</b></p><p>Delivery fee: <b>₹30</b></p><h3>Total: <span id="total">₹0</span></h3><button class="btn" style="width:100%" onclick="checkout()">Place order</button></div></aside><div id="toast"></div>
<script>
const restaurants=[
{name:"Spice Route Biryani",cat:"Biryani",rating:"4.6",time:"25–30 min",emoji:"🍛",desc:"Hyderabadi dum biryani & kebabs"},
{name:"The Pizza Corner",cat:"Pizza",rating:"4.4",time:"20–25 min",emoji:"🍕",desc:"Cheesy pizzas and sides"},
{name:"Dosa Junction",cat:"South Indian",rating:"4.5",time:"15–20 min",emoji:"🥞",desc:"Crispy dosa, idli and filter coffee"},
{name:"Burger Barn",cat:"Burgers",rating:"4.3",time:"20–25 min",emoji:"🍔",desc:"Loaded burgers and fries"},
{name:"Royal Dum House",cat:"Biryani",rating:"4.7",time:"30–35 min",emoji:"🍗",desc:"Traditional biryani and starters"},
{name:"Green Bowl Cafe",cat:"South Indian",rating:"4.2",time:"15–20 min",emoji:"🥗",desc:"Fresh meals and healthy bowls"}];
const foods=[
{name:"Hyderabadi Chicken Biryani",price:249,emoji:"🍗",restaurant:"Spice Route Biryani"},
{name:"Paneer Pizza",price:219,emoji:"🍕",restaurant:"The Pizza Corner"},
{name:"Masala Dosa",price:99,emoji:"🥞",restaurant:"Dosa Junction"},
{name:"Cheese Burger",price:149,emoji:"🍔",restaurant:"Burger Barn"},
{name:"Chicken Wings",price:179,emoji:"🍗",restaurant:"Royal Dum House"},
{name:"Veg Rice Bowl",price:129,emoji:"🥗",restaurant:"Green Bowl Cafe"}];
let category="All",cart={};
const rupee=n=>"₹"+n;
function render(){let q=document.getElementById("search").value.toLowerCase();
let rs=restaurants.filter(r=>(category==="All"||r.cat===category)&&(`${r.name} ${r.cat} ${r.desc}`).toLowerCase().includes(q));
document.getElementById("restaurantList").innerHTML=rs.map(r=>`<article class="card"><div class="emoji">${r.emoji}</div><div class="info"><h3>${r.name}</h3><div>⭐ ${r.rating}　·　🕒 ${r.time}</div><p class="muted">${r.desc}</p></div></article>`).join("")||"<p>No restaurants found.</p>";
let fs=foods.filter(f=>(f.name+" "+f.restaurant).toLowerCase().includes(q));
document.getElementById("foodList").innerHTML=fs.map(f=>`<article class="food"><div class="emoji">${f.emoji}</div><div class="foodinfo"><h3>${f.name}</h3><div class="muted">${f.restaurant}</div><b>${rupee(f.price)}</b></div><button class="add" onclick="add(${foods.indexOf(f)})">ADD +</button></article>`).join("")||"<p>No dishes found.</p>";}
function add(i){cart[i]=(cart[i]||0)+1;renderCart();toast(foods[i].name+" added!")}
function qty(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];renderCart()}
function renderCart(){let entries=Object.entries(cart),n=entries.reduce((s,[i,q])=>s+q,0),sub=entries.reduce((s,[i,q])=>s+foods[i].price*q,0);document.getElementById("count").textContent=n;document.getElementById("subtotal").textContent=rupee(sub);document.getElementById("total").textContent=rupee(sub+(n?30:0));document.getElementById("cartItems").innerHTML=entries.length?entries.map(([i,q])=>`<div class="cartrow"><div><b>${foods[i].name}</b><div class="muted">${rupee(foods[i].price)}</div></div><div><button onclick="qty(${i},-1)">−</button> ${q} <button onclick="qty(${i},1)">+</button></div></div>`).join(""):'<div class="empty">🛍️<h3>Your cart is empty</h3>Add a dish to get started.</div>'}
function openCart(){document.getElementById("cart").classList.add("open")}function closeCart(){document.getElementById("cart").classList.remove("open")}
function checkout(){if(!Object.keys(cart).length){toast("Your cart is empty");return}toast("Demo order placed successfully! 🎉");cart={};renderCart();closeCart()}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
document.getElementById("search").addEventListener("input",render);
document.getElementById("filters").addEventListener("click",e=>{if(!e.target.dataset.cat)return;category=e.target.dataset.cat;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b===e.target));render()});
render();renderCart();
</script></body></html>
